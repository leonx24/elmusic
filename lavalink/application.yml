server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: true

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: false
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingIntervalMs: 20
    youtubePlaylistLoadLimit: 100
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: false
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
    pot:
      token: "${YOUTUBE_POT_TOKEN:}"
      visitorData: "${YOUTUBE_POT_VISITOR_DATA:}"
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
      skipInitialization: true
    ratelimit:
      ipBlocks: []
      excludedIps: []
      strategy: "ROTATING"
      searchTriggersFetch: false
    clients:
      - TV
      - ANDROID_MUSIC
      - ANDROID_VR
      - MUSIC
      - WEB
      - WEBEMBEDDED

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: DEBUG
  request:
    enabled: true
    includeHeaders: false
    includePayload: true
    maxPayloadLength: 10000
